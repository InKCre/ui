name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ui-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history for changesets
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: "pnpm"
          registry-url: https://npm.pkg.github.com
          scope: "@inkcre"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # A GitHub App token (not the default GITHUB_TOKEN) creates the release PR:
      # events produced by GITHUB_TOKEN never trigger new workflow runs, so the
      # release PR would have no CI and could not satisfy the branch ruleset.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.1
        id: release-app-token
        with:
          app-id: ${{ secrets.INKCRE_RELEASE_APP_ID }}
          private-key: ${{ secrets.INKCRE_RELEASE_APP_PRIVATE_KEY }}
          owner: InKCre
          repositories: ui
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: "chore(release): 更新包版本"
          title: "chore(release): 更新包版本"
          # The action reads this input (not the GITHUB_TOKEN env) for PR creation.
          github-token: ${{ steps.release-app-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish anonymous package download
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release:public "$(node -p "require('./packages/web/package.json').version")" --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
