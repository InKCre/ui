name: Update Design Tokens

on:
  repository_dispatch:
    types: [update-tokens]

jobs:
  transform-tokens:
    name: Transform Figma design tokens to SCSS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Configure the pnpm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, transform, and record token update
        run: pnpm tokens:update
        env:
          INKCRE_TOKEN_FILENAME: ${{ github.event.client_payload.filename }}
          INKCRE_TOKEN_JSON: ${{ toJSON(github.event.client_payload.tokens) }}
          INKCRE_CHANGESET_ID: figma-${{ github.run_id }}-${{ github.run_attempt }}
          INKCRE_CHANGESET_SUMMARY: ${{ github.event.client_payload.commitMessage || 'Update design tokens from Figma.' }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ github.event.client_payload.commitMessage || 'Update design tokens from Figma' }}
          title: "Design tokens updated from Figma"
          body: "Design tokens have been updated via Figma and need to be reviewed."
          branch: design-tokens/update-${{ github.run_id }}-${{ github.run_attempt }}
          delete-branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
