name: UI checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Reproducible workspace check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Configure the pnpm cache and registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@inkcre"

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify the workspace
        run: pnpm check

      - name: Require a package changeset
        if: github.event_name == 'pull_request'
        run: pnpm changeset:check origin/${{ github.base_ref }}

      - name: Upload the checked Histoire artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-web-histoire
          path: packages/web/.histoire/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
